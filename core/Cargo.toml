[package]
name = "mixpilot-core"
version = "0.0.2"
license = "GPL-3.0-only"
edition = "2024"

[dependencies]
libc = "0.2"
nnnoiseless = { version = "0.5", default-features = false }
pipewire = { version = "0.10.1", features = ["v1_0_0"] }  # core24 ships PipeWire 1.0.x
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
