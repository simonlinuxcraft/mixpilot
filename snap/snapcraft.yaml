name: mixpilot
title: Mixpilot
base: core24
version: '0.0.5'
summary: Mixer, sound and microphone control for PipeWire
license: GPL-3.0-only
description: |
  Mixpilot sorts every app into one of five channels: Game, Chat, Media, Music and Aux. Each channel has its own fader, mute button and equalizer. Discord lands in Chat, Spotify in Music, the browser in Media, Steam and Proton games in Game. Move an app by hand once and Mixpilot keeps it there.

  Sound
  - ChatMix: one slider shifts the balance between game and voice chat
  - Ducking lowers the other channels while someone talks in Chat
  - 10-band equalizer per channel: pick a preset for each channel, tune the built-in ones or save up to four of your own
  - Bass boost and clearer voices for the whole mix
  - Auto volume (Gentle or Night) evens out loud and quiet parts
  - Limiter on the output against sudden loud peaks

  Microphone
  - Noise suppression (RNNoise), noise gate with automatic threshold and auto gain
  - Voice presets: Natural, Warm, Radio, Broadcast
  - Shows up as "Mixpilot Microphone" in Discord, OBS and any other app
  - Hear yourself to check how you sound
  - Microphone test: record five seconds and play them back
  - Push-to-mute: one key mutes and unmutes the microphone from anywhere

  Automation
  - Autopilot switch: sorting, ducking and night mode on or off with one click
  - Night mode by time of day: quieter peaks, no bass
  - Keeps running in the background with a tray icon to mute the mic or toggle Autopilot

  Needs PipeWire with WirePlumber, the default on Ubuntu since 22.10 and on most current distributions.

  After installing, connect the two permissions Mixpilot asks for on first start:

      sudo snap connect mixpilot:pipewire && sudo snap connect mixpilot:audio-record

  Planned
  - Profiles (Gaming, Movie, Night) with one click, optionally switched by the running app
  - Headphone correction based on measured frequency responses
  - Compact mini mixer
  - Separate output device per channel
  - Separate stream mix for OBS

  Found a bug? Use the bug button in the title bar or "Report a bug" in the tray menu.
grade: stable
confinement: strict
icon: snap/gui/mixpilot.png

platforms:
  amd64:

apps:
  mixpilot:
    command: bin/launch
    autostart: mixpilot.desktop
    extensions: [gnome]
    plugs:
      - audio-playback
      - audio-record
      - pipewire
      - network
      - unity7
    environment:
      PIPEWIRE_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
      SPA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2
      PIPEWIRE_CONFIG_DIR: $SNAP/usr/share/pipewire

parts:
  launcher:
    plugin: dump
    source: snap/local
    organize:
      launch: bin/launch

  # rustup from its installer, not the snap: with the gnome extension's LD_LIBRARY_PATH the
  # rustup snap mixes two glibcs and aborts. The rust plugin finds it in $HOME/.cargo/bin.
  # The toolchain is pinned to the one the last release was built with, so a build never changes compilers by itself.
  rust-deps:
    plugin: nil
    build-packages: [curl]
    override-build: |
      curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0 --no-modify-path

  core:
    plugin: rust
    source: core
    after: [rust-deps]
    # only the sources: the local target/ folders hold gigabytes of host builds
    override-pull: |
      cp -r "$CRAFT_PROJECT_DIR/core/src" "$CRAFT_PROJECT_DIR/core/Cargo.toml" "$CRAFT_PROJECT_DIR/core/Cargo.lock" "$CRAFT_PART_SRC/"
    build-packages:
      - pkg-config
      - libclang-dev
      - libpipewire-0.3-dev
    stage-packages:
      - libpipewire-0.3-0t64
      - libpipewire-0.3-modules
      - libspa-0.2-modules
      - pipewire-bin

  app:
    plugin: rust
    source: app
    after: [rust-deps]
    override-pull: |
      cd "$CRAFT_PROJECT_DIR/app"
      cp -r src ui icons capabilities build.rs Cargo.toml Cargo.lock tauri.conf.json "$CRAFT_PART_SRC/"
    rust-features:
      - tauri/custom-protocol
    build-environment:
      - MIXPILOT_BUG_URL: https://mixpilot-bugreport.mixpilot.workers.dev/submit
    build-packages:
      - pkg-config
      - libayatana-appindicator3-dev
      - libdbus-1-dev
    stage-packages:
      - libayatana-appindicator3-1
      - pulseaudio-utils
      - procps
      - curl
