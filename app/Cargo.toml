[package]
name = "mixpilot"
version = "0.0.3"
license = "GPL-3.0-only"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dbus = "0.9"  # already in the tree through tao
